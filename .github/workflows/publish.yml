name: Publish Packages to npm

on:
  push:
    tags:
      - "*-v*.*.*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Node comes from .nvmrc. check-latest forces the newest release of that line instead of a
      # possibly stale runner cache: npm Trusted Publishing (OIDC) needs npm >= 11.5.1, which only
      # Node 24.5+ bundles.
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          check-latest: true
          registry-url: "https://registry.npmjs.org"

      - name: Extract package info from tag
        id: pkg
        run: |
          TAG="${GITHUB_REF_NAME}"
          SLUG="${TAG%-v*}"
          VER="${TAG##*-v}"
          echo "slug=${SLUG}" >> $GITHUB_OUTPUT
          echo "version=${VER}" >> $GITHUB_OUTPUT
          echo "dir=packages/${SLUG}" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: npm ci

      # Soft-printed, high-blocking supply-chain gate. npm audit prints the full advisory
      # report regardless of --audit-level; the threshold only sets the exit code. --omit=dev
      # scopes it to deps that ship.
      - name: Security audit (production deps)
        run: npm audit --omit=dev --audit-level=high

      - name: Build all packages
        run: npm run build

      - name: Publish package
        shell: bash
        run: |
          set -euo pipefail

          PKGDIR="${{ steps.pkg.outputs.dir }}"
          EXPECT_VER="${{ steps.pkg.outputs.version }}"

          [[ -f "${PKGDIR}/package.json" ]] || { echo "No package.json at ${PKGDIR}"; exit 1; }

          NAME=$(node -p "require('./${PKGDIR}/package.json').name")
          VER=$(node -p "require('./${PKGDIR}/package.json').version")

          echo "Workspace: ${NAME}"
          echo "package.json version: ${VER}"
          echo "expected from tag: ${EXPECT_VER}"

          [[ "${VER}" == "${EXPECT_VER}" ]] || { echo "Version mismatch (tag vs package.json)"; exit 1; }

          if npm view "${NAME}@${VER}" version >/dev/null 2>&1; then
            echo "Already published -> skip"
            exit 0
          fi

          # Pin internal @ttt-productions/* "*" ranges to caret ranges (^x.y.z) in the
          # about-to-be-packed manifest. Source keeps "*" for workspace dev; this
          # checkout is ephemeral, so the rewrite only affects the published
          # tarball. --check then HARD-FAILS if any internal "*" survived.
          node scripts/pin-internal-deps.mjs "${PKGDIR}"
          node scripts/pin-internal-deps.mjs "${PKGDIR}" --check

          # Auth via npm Trusted Publishing (GitHub OIDC) — no NPM_TOKEN/NODE_AUTH_TOKEN.
          # Every @ttt-productions/* package must have this repo+workflow configured as a
          # Trusted Publisher on npmjs.com before this step can succeed.
          npm publish --access public --provenance --workspace "${NAME}"